; Application PHP settings (production / staging)
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 25M
post_max_size = 27M
expose_php = Off
date.timezone = UTC

; Keep real errors in the log, never in the HTTP response
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
