name: Deploy Casino Project

on:
  push:
    branches: [ main ]
  workflow_dispatch: # This enables the manual "one-click" button

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html/casino
            git pull origin main
            docker compose up -d --build
            docker compose exec -T laravel.test composer install --no-dev --optimize-autoloader
            docker compose exec -T laravel.test php artisan migrate --force
            docker compose exec -T laravel.test php artisan config:cache
            docker compose exec -T laravel.test php artisan route:cache
