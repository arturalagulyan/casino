name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # lets GITHUB_TOKEN fetch this (private) repo
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          envs: GH_TOKEN,REPO
          script: |
            set -euo pipefail
            cd /var/www/casino

            echo "==> Pulling latest code"
            # The server clone has an unauthenticated https:// origin; use this
            # run's short-lived token just for the fetch, then scrub it back out.
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            trap 'git remote set-url origin "https://github.com/${REPO}.git"' EXIT
            git fetch --prune origin
            git reset --hard origin/main

            echo "==> Building images"
            # Authenticate GitHub for Composer package downloads inside the build
            # (GitHub throttles unauthenticated traffic). compose.prod.yaml reads
            # GITHUB_TOKEN from the env into the image build args.
            export GITHUB_TOKEN="${GH_TOKEN}"
            docker compose -f compose.prod.yaml build
            unset GITHUB_TOKEN

            echo "==> Starting containers"
            docker compose -f compose.prod.yaml up -d --remove-orphans

            echo "==> Waiting for the app container"
            for i in $(seq 1 30); do
              docker compose -f compose.prod.yaml exec -T app php -v >/dev/null 2>&1 && break
              sleep 2
            done

            echo "==> Running migrations"
            docker compose -f compose.prod.yaml exec -T app php artisan migrate --force

            echo "==> Refreshing caches"
            docker compose -f compose.prod.yaml exec -T app php artisan config:cache
            docker compose -f compose.prod.yaml exec -T app php artisan view:cache
            docker compose -f compose.prod.yaml exec -T app php artisan queue:restart

            echo "==> Cycling nginx (fresh app DNS)"
            docker compose -f compose.prod.yaml restart web

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Health check"
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080

            echo "==> Done"
